name: Deploy to GitHub Pages

# Mỗi lần push lên main: build và đăng lên https://storyloop.io.vn/ (tên miền riêng, cấu hình ở Settings > Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ giữ một lượt deploy chạy cùng lúc, lượt cũ đang chạy thì để chạy xong
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Địa chỉ backend và Google Client ID lấy từ Settings > Secrets and variables > Actions > Variables.
      # Không đặt thì web build ra chạy chế độ khách như trước (không có đăng nhập).
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
