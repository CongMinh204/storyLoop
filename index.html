<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: app phủ cả vùng tai thỏ / vạch vuốt; phần nào cần tránh thì dùng env(safe-area-inset-*) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>StoryLoop - Học tiếng Trung HSK qua truyện tương tác</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- Cài như app ("Thêm vào màn hình chính"): manifest cho Android/Chrome, các thẻ apple-* cho iPhone -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StoryLoop" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description"
    content="Học tiếng Trung HSK qua những câu chuyện tương tác: nhập vai cùng nhân vật, nhận phân tích ngữ pháp ngay khi chọn đáp án, ôn từ vựng với Bloom và flashcard." />
  <!-- Thẻ chia sẻ (Facebook, Zalo...): ảnh phải là địa chỉ đầy đủ của tên miền chính thức -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="StoryLoop" />
  <meta property="og:title" content="StoryLoop - Học tiếng Trung HSK qua truyện tương tác" />
  <meta property="og:description"
    content="Nhập vai cùng nhân vật, chọn câu trả lời, nhận phân tích ngữ pháp ngay trong truyện và ôn từ vựng với Bloom và flashcard." />
  <meta property="og:url" content="https://storyloop.io.vn/" />
  <meta property="og:image" content="https://storyloop.io.vn/og-image.jpg" />
  <meta property="og:image:width" content="630" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }

    /* Vỏ app trên điện thoại: cao đúng phần nhìn thấy (dvh co giãn theo thanh địa chỉ; trình duyệt cũ dùng vh) */
    .sl-shell {
      height: 100vh;
      height: 100dvh;
    }
  </style>

</head>

<body>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
